name: Quality Gate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript and regression tests
        run: npm run quality:core
      - name: Production build (dummy public config)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          VITE_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: npm run build
